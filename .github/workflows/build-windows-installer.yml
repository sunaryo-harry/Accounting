name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js Dependencies
        run: |
          npm ci --omit=dev

      - name: Bundle Standalone Node.js Runtime for Windows
        shell: powershell
        run: |
          Write-Host "Downloading standalone Node.js x64 runtime..."
          curl.exe -s -L "https://nodejs.org/dist/v22.12.0/win-x64/node.exe" -o node.exe
          if (Test-Path node.exe) {
            Write-Host "node.exe successfully bundled: $([Math]::Round((Get-Item node.exe).Length / 1MB, 2)) MB"
          } else {
            Write-Warning "Could not download standalone node.exe, continuing"
          }

      - name: Ensure Dist Directory Exists
        shell: powershell
        run: |
          if (-not (Test-Path dist)) { New-Item -ItemType Directory -Path dist }

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: installer/InnoSetup-Script.iss

      - name: Verify Installer Artifact
        shell: powershell
        run: |
          $found = Get-ChildItem -Path dist, installer -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          $found | Select-Object FullName, Length, LastWriteTime
          if (-not $found) {
            Write-Error "Installer executable not found in dist or installer directory!"
            exit 1
          }
          Write-Host "Installer successfully built: $($found[0].FullName)"

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup-Coretax-Accounting-Enterprise-Windows-x64
          path: |
            dist/*.exe
            installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0
          name: Release v2.6.0 - Coretax Enterprise Accounting
          files: |
            dist/*.exe
          body: |
            ## Coretax Enterprise Accounting System (Windows Edition)
            **Credit by Harry Sunaryo**

            ### 🚀 Unduh & Pasang (Windows 64-bit)
            Silakan unduh berkas installer langsung di bawah ini:
            👉 **[Setup-Coretax-Accounting-Enterprise-x64.exe](https://github.com/sunaryo-harry/Accounting/releases/download/v2.6.0/Setup-Coretax-Accounting-Enterprise-x64.exe)**

            ### 📋 Fitur & Pembaruan v2.6.0:
            1. **Template Impor Data**: Tersedia format impor berkas untuk semua modul (Entitas, Akun/COA, Jurnal Umum, Buku Besar, Persediaan, Hutang & Piutang, Aset Tetap, Pajak, PSAK 46).
            2. **Manajemen Multi Entitas**: Fitur edit dan hapus data entitas bisnis dengan proteksi integritas.
            3. **Credit by Harry Sunaryo**: Tersemat pada navigasi header, footer, laporan PDF, dan halaman login.
            4. **Konfigurasi Akses Server LAN**: Pengaturan port dan host dapat diedit langsung dari web.
            5. **Autentikasi & Batasan User**: Login Administrator bawaan (`Administrator` / `Harry1175`) serta tambah pengguna dengan pembatasan hak akses modul.
            6. **Chart of Accounts (COA) Bertingkat**: Akun dapat dikembangkan dengan akun induk dan sub-akun dinamis.
            7. **Unggah Bukti PDF Transaksi Buku Besar**: Cukup unggah 1 bukti PDF untuk transaksi dengan banyak baris voucher buku besar yang sama, dilengkapi tombol lihat (view) dan unduh (download).
            8. **Standalone Windows Installer**: Sudah dilengkapi Node.js runtime bawaan (siap pakai tanpa perlu instalasi Node.js manual).
          draft: false
          prerelease: false
