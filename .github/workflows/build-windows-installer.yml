name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js Dependencies
        run: |
          npm ci --omit=dev

      - name: Ensure Dist Directory Exists
        shell: powershell
        run: |
          if (-not (Test-Path dist)) { New-Item -ItemType Directory -Path dist }

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.3.0
        with:
          path: installer/InnoSetup-Script.iss

      - name: Verify Installer Artifact
        shell: powershell
        run: |
          $found = Get-ChildItem -Path dist, installer -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          $found | Select-Object FullName, Length, LastWriteTime
          if (-not $found) {
            Write-Error "Installer executable not found in dist or installer directory!"
            exit 1
          }
          Write-Host "Installer successfully built: $($found[0].FullName)"

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup-Coretax-Accounting-Enterprise-Windows-x64
          path: |
            dist/*.exe
            installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            installer/*.exe
          name: Release ${{ github.ref_name }} - Coretax Enterprise Accounting
          body: |
            ## Coretax Enterprise Accounting System
            **Credit by Harry Sunaryo**

            ### 📦 Windows Installer
            Download dan jalankan `Setup-Coretax-Accounting-Enterprise-x64.exe` untuk memasang server akuntansi enterprise di Windows:
            - Login Administrator default: `Administrator` / `Harry1175`
            - Akses Server LAN multi-user office
            - Template impor data pada seluruh modul
            - Manajemen multi entitas dapat diedit & dihapus
            - Unggah bukti format PDF per transaksi buku besar
          draft: false
          prerelease: false
