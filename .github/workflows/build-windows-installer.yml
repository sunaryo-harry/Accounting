name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node.js Dependencies
        run: |
          npm ci --omit=dev

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $isccPath) {
            Write-Error "ISCC.exe not found!"
            exit 1
          }
          Write-Host "Compiling Inno Setup Script using: $isccPath"
          & $isccPath "installer\InnoSetup-Script.iss"

      - name: Verify Installer Artifact
        shell: powershell
        run: |
          Get-ChildItem -Path installer\*.exe | Select-Object Name, Length, LastWriteTime
          if (-not (Test-Path "installer\Setup-Coretax-Accounting-Enterprise-x64.exe")) {
            Write-Error "Installer executable not found in installer directory!"
            exit 1
          }

      - name: Upload Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Setup-Coretax-Accounting-Enterprise-Windows-x64
          path: installer\Setup-Coretax-Accounting-Enterprise-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Setup-Coretax-Accounting-Enterprise-x64.exe
          name: Release ${{ github.ref_name }} - Coretax Enterprise Accounting
          body: |
            ## Coretax Enterprise Accounting System
            **Credit by Harry Sunaryo**

            ### 📦 Windows Installer
            Download dan jalankan `Setup-Coretax-Accounting-Enterprise-x64.exe` untuk memasang server akuntansi enterprise di Windows:
            - Login Administrator default: `Administrator` / `Harry1175`
            - Akses Server LAN multi-user office
            - Template impor data pada seluruh modul
            - Manajemen multi entitas dapat diedit & dihapus
            - Unggah bukti format PDF per transaksi buku besar
          draft: false
          prerelease: false
